# 非敏感的环境变量，对应原 compose 的 .env（去掉了密码/密钥类字段）。
# backend 通过 envFrom 注入；postgres/redis 引用其中的用户名、库名、时区等。
apiVersion: v1
kind: ConfigMap
metadata:
  name: solvify-env
  namespace: solvify-agent
data:
  SOLVIFY_ROOT: "/app"
  APP_PORT: "18888"

  APP_ENV: "production"
  APP_MODE: "release"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SHUTDOWN_TIMEOUT_SECONDS: "20"

  LOG_LEVEL: "info"
  LOG_FILENAME: "/app/logs/solvify-agent.log"
  LOG_MAX_SIZE: "100"
  LOG_MAX_BACKUPS: "7"
  LOG_MAX_AGE: "30"
  LOG_COMPRESS: "true"

  LLM_PROVIDER: "mock"
  LLM_MODEL: "mock-knowledge-assistant"
  LLM_BASE_URL: ""
  LLM_TEMPERATURE: "0.7"
  LLM_MAX_TOKENS: "2000"
  LLM_TIMEOUT: "30"

  EMBEDDING_PROVIDER: "openai"
  EMBEDDING_MODEL: "text-embedding-v4"
  EMBEDDING_BASE_URL: ""
  EMBEDDING_DIMENSION: "1024"
  EMBEDDING_BATCH_SIZE: "10"

  RAG_ENABLED: "true"
  RERANKER_ENABLED: "false"
  RERANKER_ENDPOINT: ""
  RERANKER_MODEL: ""
  RERANKER_TOP_N: "3"
  RERANKER_TIMEOUT: "10"
  RERANKER_SCORE_THRESHOLD: "0.5"
  EXPANDER_ENABLED: "false"
  EXPANDER_WINDOW_SIZE: "1"
  EXPANDER_MAX_CHUNK_TOKENS: "1000"
  EXPANDER_DEDUP_THRESHOLD: "0.8"

  TOOLS_ENABLED: "true"

  DINGTALK_APP_KEY: ""
  DINGTALK_OAUTH_REDIRECT_URI: "http://127.0.0.1:18888/dingtalk/bind"

  DOCUMENT_PARSER_PYTHON_PATH: "python"
  DOCUMENT_PARSER_SCRIPT_PATH: "/app/pkg/documentparser/python/parse_document.py"
  DOCUMENT_PARSER_TIMEOUT_SECONDS: "30"

  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: "solvify"
  POSTGRES_DATABASE: "solvify_agent"
  POSTGRES_TIMEZONE: "Asia/Shanghai"
  POSTGRES_MAX_IDLE_CONNS: "5"
  POSTGRES_MAX_OPEN_CONNS: "20"
  POSTGRES_CONN_MAX_LIFETIME_MINUTES: "60"
  POSTGRES_ENABLE_PGVECTOR: "true"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "10"
