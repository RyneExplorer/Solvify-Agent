# 后端 Go 服务。镜像由 CI/CD 注入（${BACKEND_IMAGE} 占位，部署时被真实 SHA 标签替换）。
# 环境变量来自 ConfigMap solvify-env + Secret solvify-secrets；config.yaml 以文件形式挂载。
# 上传文件与日志落在本地 PVC 上，跨重启保留。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: solvify-app-data
  namespace: solvify-agent
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: solvify-agent
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "docker.io/library/solvify-agent-backend:local"
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: solvify-env
            - secretRef:
                name: solvify-secrets
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /app/logs
              subPath: logs
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: config
          secret:
            secretName: solvify-secrets
        - name: data
          persistentVolumeClaim:
            claimName: solvify-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: solvify-agent
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
