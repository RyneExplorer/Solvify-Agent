# PostgreSQL（pgvector）以 StatefulSet 运行，数据落在 local-path 动态供给的 PVC 上。
# 初始化 SQL 由 CI/CD 在部署时根据 scripts/init_knowledge_schema.sql 生成 pg-init ConfigMap 注入；
# 手动部署时若没有 pg-init，数据库仍可启动，只是不会自动建表。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: solvify-agent
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: solvify-env
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: solvify-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: solvify-env
                  key: POSTGRES_DATABASE
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: solvify-env
                  key: POSTGRES_TIMEZONE
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "solvify", "-d", "solvify_agent"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "solvify", "-d", "solvify_agent"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: initdb
          configMap:
            name: pg-init
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: solvify-agent
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
