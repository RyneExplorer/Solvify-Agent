# Redis 以 Deployment 运行，数据落在 local-path 动态供给的 PVC 上。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: solvify-agent
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: solvify-agent
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # 通过 $(REDIS_PASSWORD) 从环境变量注入密码（k8s 会对容器 command 做变量展开）
          command:
            - /bin/sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: solvify-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli -a "${REDIS_PASSWORD}" ping 2>/dev/null | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: solvify-agent
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
