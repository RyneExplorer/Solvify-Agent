# 所有敏感配置集中在本文件。首次部署前请把 CHANGE_ME_* 替换为真实值：
#   kubectl -n solvify-agent edit secret solvify-secrets
# 镜像默认匿名拉取公开 Docker Hub 镜像（国内经 DaoCloud 加速）；若设为私有，请在 backend 的 Deployment 增加 imagePullSecret。
apiVersion: v1
kind: Secret
metadata:
  name: solvify-secrets
  namespace: solvify-agent
type: Opaque
stringData:
  # ---- 数据库 / 缓存密码（被 postgres、redis、backend 引用）----
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  # ---- 第三方密钥（按需填写，留空则使用应用默认值）----
  LLM_API_KEY: ""
  EMBEDDING_API_KEY: ""
  RERANKER_API_KEY: ""
  DINGTALK_APP_SECRET: ""
  TOOLS_WEB_SEARCH_API_KEY: ""
  EMAIL_PASSWORD: ""
  # ---- 应用主配置 config.yaml（backend 以文件形式挂载到 /app/configs/config.yaml）----
  # 注意：jwt.secret 必须替换为真实随机串；database 密码字段留空，由上面的环境变量注入。
  config.yaml: |
    app:
      name: solvify-agent
      version: 0.1.0
      env: production
      mode: release
    server:
      host: "0.0.0.0"
      port: 8080
      shutdown_timeout_seconds: 20
    jwt:
      secret: "CHANGE_ME_JWT_SECRET"
      expire_hours: 24
    log:
      level: info
      filename: /app/logs/solvify-agent.log
      max_size: 100
      max_backups: 7
      max_age: 30
      compress: true
    cors:
      enabled: true
      allow_origins: ["*"]
      allow_methods: [GET, POST, PUT, DELETE, OPTIONS]
      allow_headers: [Origin, Content-Type, Authorization]
      expose_headers: []
      allow_credentials: false
      max_age: 0
    agent:
      enable_demo: true
      max_iterations: 10
      score_threshold: 0.7
    llm:
      provider: mock
      api_format: ""
      model: mock-knowledge-assistant
      api_key: ""
      base_url: ""
      temperature: 0.7
      max_tokens: 2000
      timeout: 30
    embedding:
      provider: openai
      model: text-embedding-v4
      api_key: ""
      base_url: ""
      dimension: 1024
      batch_size: 10
    rag:
      enabled: true
      top_k: 3
      recall_k: 20
      score_threshold: 0.5
      vector_weight: 0.7
      keyword_weight: 0.3
      rrf_k: 60.0
      reranker:
        enabled: false
        endpoint: ""
        model: ""
        api_key: ""
        top_n: 3
        timeout: 10
        score_threshold: 0.5
      expander:
        enabled: false
        window_size: 1
        max_chunk_tokens: 1000
        dedup_threshold: 0.8
    tools:
      enabled: true
      web_search:
        api_key: ""
        base_url: ""
    dingtalk:
      app_key: ""
      app_secret: ""
      oauth_redirect_uri: "http://127.0.0.1:18888/dingtalk/bind"
    document_parser:
      python_path: python
      script_path: /app/pkg/documentparser/python/parse_document.py
      timeout_seconds: 30
    database:
      postgres:
        host: postgres
        port: 5432
        username: solvify
        password: ""
        database: solvify_agent
        timezone: Asia/Shanghai
        max_idle_conns: 5
        max_open_conns: 20
        conn_max_lifetime_minutes: 60
        enable_pgvector: true
      redis:
        host: redis
        port: 6379
        password: ""
        db: 0
        pool_size: 10
    email:
      host: ""
      port: 465
      username: ""
      password: ""
