# 本地开发用：仅启动 PostgreSQL(pgvector) + Redis
# 用法：docker compose -f deploy/docker-compose.dev.yaml up -d
name: solvify-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: appdb
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "redis123"
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis123 ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # OTel Collector：协议垫片。
  # 应用侧只有 OTLP gRPC 出口，而 Langfuse 的 OTLP 入口只支持 HTTP，
  # 由它收 gRPC(4317) 再转成 OTLP/HTTP 转发出去。配置见 ../configs/otel-collector.yaml。
  # 凭据用宿主环境变量传入（也会自动读同目录的 .env）：
  #   LANGFUSE_HOST  Langfuse 地址。自建且跑在宿主上用 host.docker.internal；
  #                  若 Langfuse 也在本 compose 里，用 http://langfuse:3000
  #   LANGFUSE_AUTH  base64("<public_key>:<secret_key>")
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    environment:
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
      LANGFUSE_AUTH: ${LANGFUSE_AUTH:-unset}
    ports:
      - "4317:4317"
    volumes:
      - ../configs/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_dev_data:
  redis_dev_data:
