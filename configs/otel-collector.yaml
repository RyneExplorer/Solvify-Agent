# OTel Collector —— 协议垫片
#
# 存在的原因：Langfuse 的 OTLP 入口只支持 HTTP，不支持 gRPC；
# 而本项目的 exporter 只有 otlptracegrpc（internal/observability/provider.go）。
# 这个 Collector 左边用 gRPC 收（应用侧零改动），右边转成 OTLP/HTTP 发给 Langfuse。
#
# 两段式启用：
#   阶段一「证通」：pipeline 只用 debug 导出器，span 打到容器 stdout，肉眼确认链路通。
#   阶段二「接三方」：把 pipeline 的 exporters 换成 otlphttp/langfuse，并补上环境变量。
#
# 凭据只放 Collector 的环境变量，绝不写进本文件或应用配置：
#   LANGFUSE_HOST  https://cloud.langfuse.com（或自建地址，如 http://host.docker.internal:3000）
#   LANGFUSE_AUTH  base64("<public_key>:<secret_key>")，即 Basic 认证的用户名密码对

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # batch 减少出站请求数。1s 的窗口是为了让本地调试时 span 尽快可见，
  # 生产环境可调大到 5s。
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  # 阶段一用：把 span 详情打到容器日志。
  debug:
    verbosity: detailed

  # 阶段二用：OTLP/HTTP → Langfuse。
  # 组件名用 otlp_http（v0.160.0 起 otlphttp 别名已弃用，会打 deprecation 警告）。
  # otlp_http 会自动在 endpoint 后追加 /v1/traces，
  # 所以这里写到 /api/public/otel 即可，最终请求路径是 /api/public/otel/v1/traces。
  # 带 :- 的是默认值，保证环境变量没配时 Collector 也能启动，不会因缺变量直接崩。
  otlp_http/langfuse:
    endpoint: ${env:LANGFUSE_HOST:-http://host.docker.internal:3000}/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH:-unset}"
      x-langfuse-ingestion-version: "4"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      # 已接三方：span 同时送 Langfuse 和容器日志。
      # 调试期保留 debug 便于对账；稳定后可删掉 debug，只留 otlp_http/langfuse。
      exporters: [debug, otlp_http/langfuse]
  telemetry:
    logs:
      level: info
