name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-check:
    name: Go 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 运行测试
        run: go test -race -coverprofile=coverage.out ./...

      - name: 运行静态检查
        run: go vet ./...

      - name: 编译后端
        run: go build -buildvcs=false -o /tmp/solvify-agent ./cmd/server

  frontend-check:
    name: Vue 生产构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design/vue
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: design/vue/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

  deployment-check:
    name: 部署配置检查（k3s 清单）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 检查 Shell 语法
        run: bash -n deploy/k3s/apply.sh

      - name: 校验 k3s 清单（YAML 语法 + 结构，无需集群）
        run: |
          # kubectl apply 即使 --validate=false 仍会连 API Server 做 discovery，runner 无集群会失败；
          # 这里改用 PyYAML 纯本地解析，校验每个清单可解析且含 apiVersion/kind。
          python3 -m venv /tmp/solvify-venv
          /tmp/solvify-venv/bin/pip install --quiet pyyaml
          /tmp/solvify-venv/bin/python - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob("deploy/k3s/*.yaml"))
          if not files:
              print("错误：deploy/k3s 下没有 .yaml 清单")
              sys.exit(1)
          total = 0
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  docs = [d for d in yaml.safe_load_all(fh) if d is not None]
              for d in docs:
                  if not (isinstance(d, dict) and d.get("apiVersion") and d.get("kind")):
                      print(f"错误：{f} 存在缺少 apiVersion/kind 的文档")
                      sys.exit(1)
                  print(f"OK  {f}  ->  {d['apiVersion']}  {d['kind']}")
                  total += 1
          print(f"共校验 {len(files)} 个文件 / {total} 个资源，全部通过")
          PY

  deploy:
    name: 部署生产环境（服务器本地构建）
    runs-on: ubuntu-latest
    needs:
      - go-check
      - frontend-check
      - deployment-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: solvify-agent-production
      cancel-in-progress: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          install -d -m 0700 "$HOME/.ssh"
          # 去除 Windows CRLF（\r）：否则 OpenSSH 加载私钥报 "error in libcrypto"、known_hosts 也可能对不上
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/solvify_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/solvify_deploy" "$HOME/.ssh/known_hosts"

          # 校验私钥可被 OpenSSH 解析（失败给出清晰提示，而非后面模糊的 publickey）
          ssh-keygen -y -P "" -f "$HOME/.ssh/solvify_deploy" > /dev/null 2>&1 || {
            echo "DEPLOY_SSH_KEY 私钥无法解析：请确认完整粘贴了私钥（含 -----BEGIN/END----- 两行、中间无多余换行/空格）"
            exit 1
          }

          {
            echo "Host solvify-production"
            echo "  HostName $DEPLOY_HOST"
            echo "  Port $DEPLOY_PORT"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile $HOME/.ssh/solvify_deploy"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 20"
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"

          ssh solvify-production "printf 'SSH 连接成功\n'"

      - name: 同步源码到服务器
        run: |
          tar --exclude='.git' --exclude='design/vue/node_modules' -czf "${{ runner.temp }}/solvify-src.tar.gz" .
          scp "${{ runner.temp }}/solvify-src.tar.gz" "solvify-production:/tmp/solvify-src.tar.gz"
          ssh solvify-production "sudo mkdir -p /opt/solvify-agent/src && sudo tar -xzf /tmp/solvify-src.tar.gz -C /opt/solvify-agent/src && sudo rm -f /tmp/solvify-src.tar.gz"

      - name: 应用基础设施清单
        run: |
          ssh solvify-production "bash -s" <<'EOF'
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            sudo KUBECONFIG="$KUBECONFIG" kubectl apply -f /opt/solvify-agent/src/deploy/k3s/00-namespace.yaml
            # 密钥只在首次（集群里还不存在时）创建，避免覆盖手动设置的真实密钥。
            if ! sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent get secret solvify-secrets >/dev/null 2>&1; then
              sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f /opt/solvify-agent/src/deploy/k3s/01-secrets.yaml
            else
              echo "secret solvify-secrets 已存在，跳过（不覆盖手动设置的真实密钥）"
            fi
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f /opt/solvify-agent/src/deploy/k3s/02-configmap.yaml
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f /opt/solvify-agent/src/deploy/k3s/03-postgres.yaml
            sudo KUBECONFIG="$KUBECONFIG" kubectl -n solvify-agent apply -f /opt/solvify-agent/src/deploy/k3s/04-redis.yaml
          EOF

      - name: 服务器本地构建并部署 backend/frontend
        run: |
          ssh solvify-production "sudo bash /opt/solvify-agent/src/deploy/build-on-server.sh"

      - name: 外部健康检查
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          health_base_url="${PRODUCTION_URL:-http://${DEPLOY_HOST}:18888}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 \
              "${health_base_url%/}/health" >/dev/null; then
              echo "生产环境健康检查通过"
              exit 0
            fi
            echo "等待生产环境健康检查，第 ${attempt} 次"
            sleep 5
          done
          echo "生产环境外部健康检查失败" >&2
          exit 1
